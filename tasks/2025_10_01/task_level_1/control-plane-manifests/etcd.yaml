apiVersion: v1
kind: Pod
metadata:
  annotations:
    kubeadm.kubernetes.io/etcd.advertise-client-urls: https://10.0.10.2:2379
  creationTimestamp: null
  labels:
    component: etcd
    tier: control-plane
  name: etcd
  namespace: kube-system
spec:
  containers:
  - command:
    - etcd
    - --advertise-client-urls=http://10.0.10.2:2379
    - --listen-client-urls=http://0.0.0.0:2379
    - --data-dir=/var/lib/etcd
    - --listen-peer-urls=http://10.0.10.2:2380
    - --initial-cluster=default=http://10.0.10.2:2380
    - --initial-advertise-peer-urls=http://10.0.10.2:2380
    - --initial-cluster-state=new
    - --initial-cluster-token=test-token
    image: registry.k8s.io/etcd:3.5.12-0
    imagePullPolicy: IfNotPresent
    # livenessProbe:
    #   failureThreshold: 8
    #   httpGet:
    #     host: 127.0.0.1
    #     path: /health?exclude=NOSPACE&serializable=true
    #     port: 2381
    #     scheme: HTTP
    #   initialDelaySeconds: 10
    #   periodSeconds: 10
    #   timeoutSeconds: 15
    name: etcd
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
    # startupProbe:
    #   failureThreshold: 24
    #   httpGet:
    #     host: 127.0.0.1
    #     path: /health?serializable=false
    #     port: 2381
    #     scheme: HTTP
    #   initialDelaySeconds: 10
    #   periodSeconds: 10
    #   timeoutSeconds: 15
    volumeMounts:
    - mountPath: /var/lib/etcd
      name: etcd-data
  hostNetwork: true
  priority: 2000001000
  priorityClassName: system-node-critical
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
  - hostPath:
      path: /var/lib/etcd
      type: DirectoryOrCreate
    name: etcd-data
status: {}